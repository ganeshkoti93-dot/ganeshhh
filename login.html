<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Best Mobiles</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #17233c;
        }

        /* ================= HEADER ================= */

        header {
            background: #062653;
            color: white;
            padding: 15px 4%;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            min-width: 190px;
        }

        .logo-icon {
            width: 35px;
            height: 48px;
            border: 3px solid #ffd21c;
            border-radius: 7px;
            margin-right: 10px;
            position: relative;
        }

        .logo-icon::after {
            content: "";
            width: 5px;
            height: 5px;
            background: #ffd21c;
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
            left: 12px;
        }

        .logo-text h2 {
            font-size: 21px;
            color: white;
        }

        .logo-text h2 span {
            color: #ffd21c;
        }

        .logo-text p {
            font-size: 9px;
            color: #d9e2ef;
            margin-top: 3px;
        }

        /* ================= HEADER ACTIONS ================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .header-actions a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .header-actions a:hover {
            color: #ffd21c;
        }

        /* ================= NAVIGATION ================= */

        .navigation {
            margin-top: 15px;
            border-top: 1px solid #1d4778;
            padding-top: 12px;
            display: flex;
            gap: 55px;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .navigation a:hover {
            color: #ffd21c;
        }

        /* ================= LOGIN SECTION ================= */

        .login-section {
            min-height: 560px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 400px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 10px;
            border: 1px solid #e0e5eb;
            box-shadow: 0 8px 22px rgba(0,0,0,0.10);
        }

        .login-box h2 {
            text-align: center;
            color: #062653;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #7a8492;
            font-size: 12px;
            margin-bottom: 25px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #17233c;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #dce3eb;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #0864b6;
        }

        .login-btn {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 5px;
            background: #ffd21c;
            color: #062653;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #ffdf55;
        }

        /* ================= REGISTER LINK ================= */

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #7a8492;
            font-size: 12px;
        }

        .register-text a {
            color: #0864b6;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            color: #062653;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #062653;
            color: white;
            padding: 25px 5% 15px;
        }

        .copyright {
            border-top: 1px solid #28507d;
            padding-top: 15px;
            text-align: center;
            color: #aebfd3;
            font-size: 10px;
        }

        .copyright a {
            color: #ffd21c;
            text-decoration: none;
        }

        .copyright a:hover {
            color: white;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .top-header {
                justify-content: center;
                flex-wrap: wrap;
            }

            .logo {
                min-width: auto;
            }

            .header-actions {
                gap: 15px;
            }

            .navigation {
                justify-content: center;
                gap: 20px;
                flex-wrap: wrap;
            }

            .login-box {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="top-header">

        <div class="logo">

            <div class="logo-icon"></div>

            <div class="logo-text">

                <h2>Best <span>Mobiles</span></h2>

                <p>Your Perfect Mobile Partner</p>

            </div>

        </div>


        <div class="header-actions">

            <a href="login.html" class="login">
                ♙ &nbsp; Login
            </a>

            <a href="cart.html" class="cart">
                🛒 Cart
            </a>

        </div>

    </div>


    <nav class="navigation">

        <a href="index.html">Home</a>

        <a href="mo.html">Mobiles</a>

        <a href="offers.html">Offers</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>



<!-- ================= LOGIN ================= -->

<section class="login-section">

    <div class="login-box">

        <h2>Login</h2>

        <p class="subtitle">
            Login to your Best Mobiles account
        </p>


        <form onsubmit="loginUser(event)">


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer>

    <div class="copyright">

        © 2026 Best Mobiles. All Rights Reserved.

        &nbsp; | &nbsp;

        <a href="contact.html">
            Contact Us
        </a>

    </div>

</footer>



<!-- ================= LOGIN SCRIPT ================= -->

<script>

function loginUser(event) {

    event.preventDefault();


    let email =
        document.getElementById("email").value.trim();


    let password =
        document.getElementById("password").value;


    let savedUser =
        JSON.parse(localStorage.getItem("user"));


    if (!savedUser) {

        alert(
            "No account found. Please create an account first."
        );

        return;

    }


    if (
        email === savedUser.email &&
        password === savedUser.password
    ) {

        localStorage.setItem(
            "loggedInUser",
            savedUser.name
        );


        alert(
            "Login successful! Welcome " +
            savedUser.name
        );


        window.location.href = "index.html";

    }

    else {

        alert(
            "Invalid email or password!"
        );

    }

}

</script>


</body>
</html>
