<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Best Mobiles</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #17233c;
        }

        /* HEADER */
        header {
            background: #17233c;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo span {
            color: #ffd21c;
        }

        .search {
            flex: 1;
            display: flex;
            max-width: 650px;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
        }

        .search button {
            background: #ffd21c;
            border: none;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        /* NAV */
        nav {
            background: white;
            padding: 15px 5%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        nav a {
            color: #17233c;
            text-decoration: none;
            margin-right: 30px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e5b900;
        }

        /* TITLE */
        .title {
            text-align: center;
            padding: 35px 20px;
        }

        .title h1 {
            font-size: 30px;
        }

        /* CART */
        .cart-container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
        }

        .cart-item img {
            width: 100px;
            height: 120px;
            object-fit: contain;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* QUANTITY */
        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            background: #17233c;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
        }

        /* REMOVE */
        .remove {
            background: #ffd21c;
            color: #17233c;
            border: none;
            padding: 9px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        /* TOTAL */
        .cart-summary {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            text-align: right;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
        }

        .cart-summary h2 {
            margin-bottom: 20px;
        }

        .checkout {
            background: #ffd21c;
            color: #17233c;
            border: none;
            padding: 13px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .checkout:hover {
            background: #e5b900;
        }

        /* EMPTY CART */
        .empty {
            background: white;
            text-align: center;
            padding: 50px;
            border-radius: 10px;
        }

        .empty a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #ffd21c;
            color: #17233c;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        /* FOOTER */
        footer {
            margin-top: 50px;
            background: #17233c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {

            .cart-item {
                flex-wrap: wrap;
            }

            .search {
                order: 3;
                flex-basis: 100%;
            }

            header {
                flex-wrap: wrap;
            }

        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        BEST <span>MOBILES</span>
    </div>

    <div class="search">

        <input
            type="text"
            placeholder="Search mobiles, brands and models"
        >

        <button>
            Search
        </button>

    </div>

    <a href="login.html">Login</a>

    <a href="cart.html">🛒 Cart</a>

</header>


<nav>

    <a href="index.html">Home</a>

    <a href="mo.html">Mobiles</a>

    <a href="offers.html">Offers</a>

    <a href="contact.html">Contact</a>

</nav>


<section class="title">

    <h1>My Cart 🛒</h1>

</section>


<div class="cart-container">

    <div id="cartItems"></div>


    <div class="cart-summary">

        <h2>
            Total: ₹<span id="total">0</span>
        </h2>

        <button
            class="checkout"
            onclick="checkout()"
        >
            Proceed to Checkout
        </button>

    </div>

</div>


<footer>

    <p>
        © 2026 Best Mobiles. All Rights Reserved.
    </p>

</footer>


<script>

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


/* =========================
   DISPLAY CART
========================= */

function displayCart() {

    const cartItems =
        document.getElementById("cartItems");

    const totalElement =
        document.getElementById("total");

    cartItems.innerHTML = "";


    /* EMPTY CART */

    if (cart.length === 0) {

        cartItems.innerHTML = `

            <div class="empty">

                <h2>Your Cart is Empty</h2>

                <p>
                    Add some mobiles to your cart.
                </p>

                <a href="mo.html">
                    Continue Shopping
                </a>

            </div>

        `;

        totalElement.innerText = "0";

        return;
    }


    let total = 0;


    /* DISPLAY PRODUCTS */

    cart.forEach(function(item, index) {

        total +=
            item.price * item.quantity;


        cartItems.innerHTML += `

            <div class="cart-item">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >


                <div class="item-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        ${item.brand}
                    </p>

                    <p class="price">
                        ₹${item.price.toLocaleString("en-IN")}
                    </p>

                </div>


                <div class="quantity">

                    <button
                        onclick="decrease(${index})"
                    >
                        −
                    </button>

                    <strong>
                        ${item.quantity}
                    </strong>

                    <button
                        onclick="increase(${index})"
                    >
                        +
                    </button>

                </div>


                <button
                    class="remove"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

        `;

    });


    totalElement.innerText =
        total.toLocaleString("en-IN");

}


/* =========================
   INCREASE
========================= */

function increase(index) {

    cart[index].quantity++;

    saveCart();

}


/* =========================
   DECREASE
========================= */

function decrease(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);

    }

    saveCart();

}


/* =========================
   REMOVE
========================= */

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

}


/* =========================
   SAVE CART
========================= */

function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;

    }

    window.location.href =
        "checkout.html";

}


/* =========================
   LOAD CART
========================= */

displayCart();

</script>

</body>
</html>
