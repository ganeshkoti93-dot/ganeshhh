<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Best Mobiles</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #17233c;
        }

        header {
            background: #062653;
            color: white;
            padding: 15px 4%;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo-icon {
            width: 35px;
            height: 48px;
            border: 3px solid #ffd21c;
            border-radius: 7px;
            margin-right: 10px;
            position: relative;
        }

        .logo-icon::after {
            content: "";
            width: 5px;
            height: 5px;
            background: #ffd21c;
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
            left: 12px;
        }

        .logo-text h2 {
            font-size: 21px;
        }

        .logo-text h2 span {
            color: #ffd21c;
        }

        .logo-text p {
            font-size: 9px;
            color: #d9e2ef;
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            gap: 25px;
        }

        .header-actions a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .header-actions a:hover {
            color: #ffd21c;
        }

        .navigation {
            margin-top: 15px;
            border-top: 1px solid #1d4778;
            padding-top: 12px;
            display: flex;
            gap: 55px;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .navigation a:hover {
            color: #ffd21c;
        }

        .register-container {
            width: 420px;
            max-width: 90%;
            background: white;
            margin: 45px auto;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .register-container h2 {
            text-align: center;
            color: #062653;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d5dce5;
            border-radius: 5px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0864b6;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: #ffd21c;
            color: #062653;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #ffdf55;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .login-link a {
            color: #0864b6;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background: #062653;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            .top-header {
                flex-wrap: wrap;
                gap: 15px;
            }

            .navigation {
                justify-content: center;
                gap: 20px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="top-header">

        <div class="logo">
            <div class="logo-icon"></div>

            <div class="logo-text">
                <h2>Best <span>Mobiles</span></h2>
                <p>Your Perfect Mobile Partner</p>
            </div>
        </div>

        <div class="header-actions">
            <a href="login.html">Login</a>
            <a href="cart.html">🛒 Cart</a>
        </div>

    </div>

    <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="mo.html">Mobiles</a>
        <a href="offers.html">Offers</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<div class="register-container">

    <h2>Create Account</h2>

    <form onsubmit="registerUser(event)">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="mobile"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password"
                   minlength="6"
                   required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   minlength="6"
                   required>
        </div>

        <button type="submit" class="register-btn">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<footer>
    © 2026 Best Mobiles. All Rights Reserved.
    <a href="contact.html">
            Contact Us
        </a>
</footer>


<script>

function registerUser(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    let user = {
        name: name,
        email: email,
        mobile: mobile,
        password: password
    };

    localStorage.setItem("user", JSON.stringify(user));

    alert("Account created successfully!");

    window.location.href = "login.html";
}

</script>

</body>
</html>
